  http: ^1.6.0
  intl: ^0.20.3
  just_audio: ^0.10.6
  path_provider: ^2.1.6
  permission_handler: ^13.0.2
  speech_to_text: ^7.5.0
  timezone: ^0.11.2
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
