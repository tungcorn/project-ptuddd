publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  cloud_firestore: ^7.1.0
  collection: ^1.19.1
  connectivity_plus: ^7.3.2
  crypto: ^3.0.8
  file_picker: ^13.3.3
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
