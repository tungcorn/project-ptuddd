  fl_chart: ^1.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_local_notifications: ^23.0.2
  flutter_riverpod: ^3.5.0
  flutter_timezone: ^5.1.1
  flutter_tts: ^4.2.5
  go_router: ^18.1.4
  google_mlkit_translation: ^1.0.3
  google_sign_in: ^7.2.0
  hive_ce: ^2.23.3
